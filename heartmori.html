.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 8px}.lbl b{font-size:14px}.lbl small{font-size:12px;color:var(--appsoft)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stp{border:2px solid transparent;background:#fff;border-radius:14px;padding:4px 2px 5px;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:700;min-height:44px}
.stp svg{width:100%;display:block}
.stp[aria-pressed=true]{border:2px dashed var(--pkd);background:var(--pkc)}
.who-b .stp[aria-pressed=true]{border-color:var(--bld);background:var(--blc)}
.stp:disabled{opacity:.4;cursor:default}
.stp small{font-size:10px;font-weight:400;color:var(--appsoft)}
.shact{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:6px}
.mlist{display:grid;gap:8px;margin:6px 0 4px}
.mlist button{min-height:48px;border-radius:14px;border:2px solid #efdccf;background:#fff;font-weight:700;font-size:14px;text-align:left;padding:0 14px}
.mlist button.warn{color:#b3263a;border-color:#f3c1c9}
.mlist p{margin:0;font-size:12px;color:var(--appsoft)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:min(440px,calc(100% - 28px));z-index:8;background:#fff;border:2px solid var(--brown);border-radius:16px;padding:10px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);transform:translateY(-120px);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.toast.on{transform:none}
.toast svg{width:18px;height:18px;flex:none}
.lv{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:7;background:rgba(45,28,22,.45);display:grid;place-items:center;padding:20px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lv>div{background:var(--app);border-radius:24px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;animation:up .4s}
.lv .cp{width:220px}.lv h3{font:700 26px/1.15 var(--hand);margin:0}.lv p{margin:0 0 8px;font-size:14px;color:var(--appsoft)}
.qrcard{background:#fff;border:3px solid var(--brown);border-radius:28px;padding:14px 18px 16px;display:grid;justify-items:center;gap:6px;text-align:center;margin:6px auto 12px;width:min(320px,100%)}
.qrcard .cp{width:200px;margin-bottom:-26px;position:relative;z-index:1}
.qrimg{width:200px;aspect-ratio:1;border:4px solid #f07f9c;border-radius:18px;padding:8px;background:#fff;outline:4px solid #6f9be0;outline-offset:3px}
.qrimg svg{width:100%;height:100%;display:block}
.qrcard b{font:700 24px var(--hand);margin-top:8px}.qrcard code{font-size:12px;color:var(--appsoft)}
.urlbox{font-size:12px;background:#fff;border:2px dashed #ecd7c8;border-radius:12px;padding:8px 10px;word-break:break-all;user-select:all;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.keybox{background:#fff;border:2px dashed #e9c76a;border-radius:14px;padding:10px 14px;display:grid;gap:2px}.keybox small{font-size:12px;color:var(--appsoft)}.keybox b{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.04em;word-break:break-all}

.recent a span{font-weight:400;font-size:12px;color:var(--appsoft)}
.cp svg{width:100%;height:auto;display:block;overflow:visible}
.ln{stroke:#4a3832;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.o{fill:none}.ink{fill:#4a3832}.thin{stroke-width:1.4}

.mv{transform-box:fill-box}
.an-sway .bp{animation:swP 3.2s ease-in-out infinite}.an-sway .bb{animation:swB 3.2s ease-in-out infinite}
@keyframes swP{50%{transform:rotate(2.5deg)}}@keyframes swB{50%{transform:rotate(-2.5deg)}}
.an-beat .bob{animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,45%,100%{transform:scale(1)}15%{transform:scale(1.06,.96)}30%{transform:scale(1.02)}}
.an-kiss .bp,.an-kissB .bb{animation:lunge 1.5s ease-in-out infinite}
.an-kiss .bb,.an-kissB .bp{animation:startle 1.5s ease-in-out infinite}
@keyframes lunge{0%,100%{transform:none}40%,60%{transform:translateX(var(--ld,5px)) rotate(var(--lr,3deg))}}
.an-kissB .bb{--ld:-5px;--lr:-3deg}

.an-bounce .bp{animation:hop .75s ease-in-out infinite}.an-bounce .bb{animation:hop .75s .37s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-7px)}}
.an-huff .bob{animation:huff 1.8s ease-in-out infinite}
@keyframes huff{0%,35%,100%{transform:none}10%{transform:rotate(-3deg)}20%{transform:rotate(3deg)}}
.an-huff .hm{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.an-huff .hm:nth-of-type(2){animation-delay:.2s}.an-huff .hm:nth-of-type(3){animation-delay:.4s}
@keyframes pop{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}}
.an-sniff .bob{animation:sniff 1.3s ease-in-out infinite}
@keyframes sniff{50%{transform:translateY(1.5px) scale(1.015,.985)}}
.an-sniff .lt{animation:flt 2.4s ease-in-out infinite}

.an-drift .bp{animation:drP 3.4s ease-in-out infinite}.an-drift .bb{animation:drB 3.4s ease-in-out infinite}
@keyframes drP{50%{transform:translateX(-5px) rotate(-2deg)}}@keyframes drB{50%{transform:translateX(5px) rotate(2deg)}}
.an-jump .bob{animation:jump 1s ease-in-out infinite}
@keyframes jump{30%{transform:translateY(-12px)}55%{transform:translateY(0) scale(1.05,.95)}70%{transform:none}}
.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.tw:nth-of-type(2n){animation-delay:.5s}
@keyframes tw{50%{transform:scale(.7);opacity:.6}}
.cf{animation:cf 2.6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.cf:nth-of-type(3n){animation-delay:-.9s}.cf:nth-of-type(3n+1){animation-delay:-1.7s}
@keyframes cf{0%{transform:translateY(-6px) rotate(0)}100%{transform:translateY(10px) rotate(180deg)}}
.meet .mp{animation:inL 1.1s cubic-bezier(.3,1.35,.5,1) both}.meet .mb{animation:inR 1.1s cubic-bezier(.3,1.35,.5,1) both}
@keyframes inL{from{transform:translateX(-70px)}}@keyframes inR{from{transform:translateX(70px)}}
@media (prefers-reduced-motion:reduce){.cp *,.wait *,.dots i{animation:none!important}.fx{display:none}.toast{transition:none}}

 if(MODE==='local')h+=ui.confirm==='wipe'?`<button type="button" class="warn" data-act="wipe2">모든 추억과 자리를 지울게요 (되돌릴 수 없어요)</button>`:`<button type="button" class="warn" data-act="wipe">일기 전부 지우고 새로 시작</button>`;
 h+=`</div><button class="ghost" type="button" data-act="close" style="width:100%;margin-top:10px">닫기</button>`;openLayer(h,'설정')}
const nowT=()=>Date.now();
const act={
 async claim(el){if(ui.busy)return;ui.busy=true;const s=el.dataset.s;
  try{const ok=await B.claim(s,ME,ui.reclaim);if(!ok)toast(`방금 짝꿍이 먼저 ${NM[s]}을 골랐어요`);else{ui.reclaim=false;ui.guest=false}}
  catch(e){toast('연결이 불안정해요. 잠시 후 다시 눌러 주세요')}ui.busy=false;render()},
 guest(){ui.guest=true;render()},reclaim(){ui.reclaim=true;render()},unreclaim(){ui.reclaim=false;render()},toPick(){ui.guest=false;closeSheet(true);render()},
 async create(){const m=me();if(!m||ui.busy)return;ui.busy=true;
  const item=($('item').value.trim()||'우리 물건').slice(0,24),met=okDate($('met').value)?$('met').value:iso(today());
  try{await B.createDiary({item,met,by:m,created:nowT()})}catch(e){toast('일기를 만들지 못했어요. 다시 눌러 주세요')}ui.busy=false},
 write(){openSheet({type:'write',stamp:null})},
 reply(el){openSheet({type:'reply',id:el.dataset.id,stamp:null})},
 close(){closeSheet()},
 pick(el){const sh=ui.sheet;if(!sh)return;sh.stamp=okK(el.dataset.k);$('lay').querySelectorAll('.stp').forEach(b=>b.setAttribute('aria-pressed',b===el));
  $('tas').innerHTML=thumb(sh.stamp);$('sv').disabled=!canSave()},
 async save(){if(!canSave())return;const sh=ui.sheet,m=me();$('sv').disabled=true;
  try{if(sh.type==='write'){await B.addEntry({by:m,date:iso(today()),title:$('st').value.trim().slice(0,30),body:$('sb').value.trim().slice(0,300),stamp:sh.stamp,t:nowT()});
    closeSheet();play(sh.stamp,{say:'짝꿍한테 보냈어!',ms:3200})}
   else{await B.addReply(sh.id,{by:m,stamp:sh.stamp,text:$('sr').value.trim().slice(0,40),t:nowT()});closeSheet();play(sh.stamp,{say:'답장 보냈어!',ms:3000})}}
  catch(e){$('sv').disabled=false;toast('저장하지 못했어요. 다시 눌러 주세요')}},
 replay(el){scrollTo({top:0,behavior:'smooth'});play(okK(el.dataset.k),{ms:3200})},
 heart(){const m=me(),o=OT[m];if(ui._hc&&nowT()-ui._hc<1500)return;ui._hc=nowT();
  play(m==='pink'?'kiss':'kissB',{say:`${NM[o]}한테 하트 보냈어!`,hearts:6,dir:'out',ms:2600});B.ping(m,{kind:'heart',t:nowT()}).catch(()=>{})},
 miss(){const m=me();play('miss',{say:`보고 싶다고 보냈어… ${subj(OT[m])} 답할까?`,ms:7000});B.ping(m,{kind:'miss',t:nowT()}).catch(()=>{})},
 metoo(){const m=me();ui.ask=null;play('flutter',{say:'우리 곧 만나자! 꼭 붙어 있을게',meet:true,hearts:10,ms:3800});B.ping(m,{kind:'metoo',t:nowT()}).catch(()=>{})},
 more(){ui.limit+=20;render()},
 lvok(){$('lv').innerHTML='';play('cheer',{say:STAGE_SAY[stage()],hearts:8})},
 menu(){ui.confirm=null;openMenu()},
 release(){ui.confirm='release';openMenu()},
 async release2(){const m=me();closeSheet(true);if(m){await B.release(m).catch(()=>{});ui.guest=false;toast(`${NM[m]} 자리를 내려놓았어요`)}render()},
 wipe(){ui.confirm='wipe';openMenu()},
 async wipe2(){closeSheet(true);toast('일기를 지우는 중…');try{await B.wipe();known.clear();knownR.clear();ui.guest=false;toast('새 일기를 시작할 수 있어요')}catch(e){toast('지우지 못했어요')}render()},
 mkqr(){ui.newCode=newCode();render();scrollTo(0,0)},
 openc(el,e){e&&e.preventDefault();const c=okCode(el.dataset.c);if(c)location.href=navURL(c)},
 async usekey(){const k=($('key').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(k.length<16){toast('열쇠 20자리를 확인해 주세요');return}ui.busy=true;render();
  let ok=false;try{ok=await B.recover(k)}catch(e){}ui.busy=false;if(ok){ui.reclaim=false;ui.guest=false;toast('내 자리로 돌아왔어요')}else toast('열쇠가 이 QR과 맞지 않아요');render()},
 async copykey(){try{await navigator.clipboard.writeText(fmtKey(B.key()));toast('열쇠를 복사했어요')}catch(e){toast('복사가 막혀 있어요. 열쇠를 직접 적어 두세요')}},
 png(el){const c=okCode(el.dataset.c);if(!c||typeof qrcode!=='function')return;const a=document.createElement('a');a.href=qrPng(c);a.download='heartmori-'+c+'.png';document.body.appendChild(a);a.click();a.remove()},
 async copy(el){const u=codeURL(el.dataset.c);try{await navigator.clipboard.writeText(u);toast('링크를 복사했어요')}catch(e){toast('복사가 막혀 있어요. 위 링크를 길게 눌러 복사해 주세요')}},
 showqr(){openLayer(`<div class="shh"><b>우리 QR</b><span class="chip g">${esc(CODE)}</span></div>${qrCard(CODE)}<div class="urlbox">${esc(codeURL(CODE))}</div><div class="row2"><button class="ghost" type="button" data-act="copy" data-c="${CODE}">링크 복사</button><button class="ghost" type="button" data-act="png" data-c="${CODE}">PNG 저장</button></div><button class="ghost" type="button" data-act="close" style="width:100%">닫기</button>`,'우리 QR')},
 home(){location.href=navURL(null)},
 async swap(){const m=me(),o=OT[m];closeSheet(true);let dev=S.seats[o];if(!dev){dev='L'+Math.random().toString(36).slice(2,9);ME=dev;await B.claim(o,dev,true)}else ME=dev;LS.set('hm-dev',ME);toast(`이제 ${NM[o]}으로 보고 있어요`);render()}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&act[a.dataset.act]){act[a.dataset.act](a,e);return}
 const h=e.target.closest('[data-hit]');if(h&&h.closest('.hero'))poke(h.dataset.hit)});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='item'||id==='met')ui.draft[id]=e.target.value;if(ui.sheet&&$('sv'))$('sv').disabled=!canSave()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('lay').classList.contains('on'))closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ui.sheet&&me())B.typing(me(),{on:false,t:nowT()}).catch(()=>{})});
function remember(c,n){const all=LS.get('hm-recent',[]),prev=all.find(r=>r.c===c),l=all.filter(r=>r.c!==c);l.unshift({c,n:n||(prev&&prev.n)||''});LS.set('hm-recent',l.slice(0,10))}
function openCode(code){if(B&&B.stop)B.stop();clearTimeout(slowT);clearTimeout(ui.timer);
 CODE=okCode(code);S=freshS();known.clear();knownR.clear();wasLinked=null;closeSheet(true);$('lv').innerHTML='';
 Object.assign(ui,{tmp:null,ask:null,connecting:false,limit:20,guest:false,reclaim:false,draft:{},busy:false,confirm:null,offline:false,slow:false});
 if(!CODE){B=null;render();return}
 remember(CODE);B=MODE==='live'?Supa(DB,CODE):Local(CODE);B.init(H);
 slowT=setTimeout(()=>{if(!S.ready){ui.slow=true;render()}},10000);render()}
const urlCode=()=>{const c=(params.get('c')||'').trim().toLowerCase();if(c)return c;try{return decodeURIComponent((location.hash||'').slice(1)).toLowerCase()}catch(e){return''}};
(()=>{if(!DEMO&&window.supabase&&CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){try{DB=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);MODE='live'}catch(e){DB=null}}
 if(!DB)MODE='local';OWNER=false;setMode();openCode(urlCode())})();
}
