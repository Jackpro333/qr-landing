<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창업 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3eff4; --surface:#ffffff; --fg:#14202b; --muted:#5b6876; --accent:#7a3fb0; --line:#d6dde4;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10161c; --surface:#18212b; --fg:#e7edf3; --muted:#9aa8b6; --line:#273340; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px}
main{max-width:640px;margin:0 auto;display:grid;gap:28px}
.tag{justify-self:start;font-size:.8rem;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px}
h1{font-family:var(--display);font-size:2.4rem;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:10px}
h2{font-size:1.1rem;margin:0}
.btn{justify-self:start;background:var(--accent);color:#fff;text-decoration:none;border-radius:10px;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<main>
  <span class="tag">창업 2</span>
  <h1>창업 2 웹사이트</h1>
  <p>이 페이지는 QR코드 2번으로 연결되는 전용 웹사이트입니다. 창업 내용이 정해지면 이 자리에 소개, 서비스, 연락처가 들어갑니다.</p>
  <section>
    <h2>소개</h2>
    <p>준비 중입니다.</p>
  </section>
  <section>
    <h2>서비스</h2>
    <p>준비 중입니다.</p>
  </section>
  <section>
    <h2>연락처</h2>
    <p>준비 중입니다.</p>
  </section>
</main>
</body>
</html>
