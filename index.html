<!doctype html>
<html lang="ko">
<head>
<title>QR 도착 페이지</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14202b; --muted:#5b6876; --accent:#1f6feb; --line:#d6dde4;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151b; --surface:#17202a; --fg:#e7edf3; --muted:#9aa8b6; --accent:#5b9cff; --line:#273340; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px}
main{max-width:520px;margin:0 auto;display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:grid;gap:18px}
.finder{width:56px;height:56px;border:8px solid var(--fg);border-radius:6px;display:grid;place-items:center}
.finder::after{content:"";width:16px;height:16px;background:var(--accent);border-radius:2px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;border-top:1px solid var(--line);padding-top:16px;margin:0}
.meta dt{color:var(--muted);letter-spacing:.04em}
.meta dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.btn{justify-self:start;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.count{font-family:var(--mono);color:var(--fg)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="finder" aria-hidden="true"></div>
    <h1>QR코드로 잘 도착했어요</h1>
    <p>휴대폰 카메라로 QR코드를 비추면 이 페이지가 열립니다. 이 주소를 원하는 사이트로 바꾸면 같은 방식으로 어디든 연결할 수 있어요.</p>
    <dl class="meta">
      <dt>접속 시각</dt><dd id="time">—</dd>
      <dt>기기</dt><dd id="device">—</dd>
      <dt>이 기기 방문</dt><dd id="visits">1번째</dd>
    </dl>
    <button class="btn" id="hi" type="button">눌러보기</button>
    <p class="count" id="out" hidden></p>
  </div>
</main>
<script>
const now=new Date();
document.getElementById('time').textContent=now.toLocaleString('ko-KR');
const ua=navigator.userAgent;
document.getElementById('device').textContent=/iPhone|iPad/.test(ua)?'iPhone / iPad':/Android/.test(ua)?'Android':/Mac/.test(ua)?'Mac':/Windows/.test(ua)?'Windows':'기타';
let v=1;try{v=(+localStorage.getItem('visits')||0)+1;localStorage.setItem('visits',v)}catch(e){}
document.getElementById('visits').textContent=v+'번째';
let n=0;document.getElementById('hi').addEventListener('click',()=>{n++;const o=document.getElementById('out');o.hidden=false;o.textContent='버튼을 '+n+'번 눌렀어요.'});
</script>
</body>
</html>
