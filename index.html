<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네모리 · 물건 기억 태그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{color-scheme:light;--bg:#fbf2dc;--app:#fffaf3;--ink:#3d2b24;--soft:#8a7a70;--line:#f0e2cf;--brown:#3b2a24;
 --nm:#f8dd96;--nmc:#fdf2d2;--nmd:#c9952f;--pk:#f7c6d2;--pkc:#fde5eb;--pkd:#e0607e;--bl:#c5d7f3;--blc:#e4edfb;--bld:#4f7fcc;--red:#e0485a;--leaf:#6fb06a;
 --hand:"Gaegu","Nanum Pen Script",cursive;--sans:"Noto Sans KR",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--bld);outline-offset:2px}
.wrap{position:relative;max-width:480px;margin:0 auto;min-height:100dvh;background:var(--app);box-shadow:0 0 60px -20px rgba(60,30,20,.35);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;z-index:1}
.wrap.wide{max-width:1120px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hd .r{display:flex;gap:6px;align-items:center}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none}
.chip.dk{background:var(--brown);color:#fff}.chip.y{background:var(--nmc);color:#9a6b12}.chip.g{background:#efe6da;color:#7d6a60}.chip.p{background:var(--pkc);color:#c34a68}.chip.b{background:var(--blc);color:#3d6bb5}
.menu{width:40px;height:40px;border-radius:50%;border:2px solid #efdccf;background:#fff;display:grid;place-items:center;font-weight:700;line-height:1}
.ttl{font:700 32px/1.1 var(--hand);margin:4px 0 2px;letter-spacing:.03em;overflow-wrap:anywhere}
.big{font:700 34px/1.1 var(--hand);margin:0;letter-spacing:.02em}
.lead{margin:0;color:var(--soft);font-size:14px}
.muted{color:var(--soft);font-size:13px}
.spec{margin:0;color:var(--soft);font-size:14px}
.dsub{font-size:13px;color:var(--soft);margin:2px 0 12px}.dsub b{color:var(--nmd)}
.btn,.cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border:0;border-radius:999px;background:var(--brown);color:#fff;font-weight:700;font-size:15px;padding:0 20px;text-decoration:none}
.cta{display:flex;width:100%;min-height:52px}
.btn:disabled,.cta:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--brown)}
.btn.small{min-height:38px;font-size:13px;padding:0 14px}
.btn.danger{background:#fff;color:#b3263a;border:2px solid #f3c1c9}
.btn.danger.armed{background:#b3263a;color:#fff;border-color:#b3263a}
.link{border:0;background:none;text-decoration:underline;color:var(--soft);font-size:13px;min-height:44px;padding:0 6px}
input,textarea{font:16px var(--sans);width:100%;border:2px solid #ead8b0;border-radius:14px;padding:11px 13px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:96px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field>label,.field>.lbl{font-size:13px;font-weight:700;color:var(--soft)}
.req{color:var(--red);margin-left:2px}
.hint{font-size:12px;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#b3263a;font-size:13px;margin:4px 0}
.okmsg{background:#e6f4e3;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 10px}
.fine{font-size:12px;color:var(--soft);text-align:center;margin:12px 0 24px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{display:flex;align-items:center;gap:6px;border:2px solid #efdcb8;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;background:#fff}
.choices label:has(input:checked){border-color:var(--brown);background:var(--nmc);font-weight:700}
.choices input{accent-color:var(--brown);width:auto;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:2px solid #efdcb8;background:#fff;border-radius:999px;padding:6px 14px;min-height:40px;font-size:14px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--brown);color:#fff;border-color:var(--brown)}
.pillo{border:2px solid var(--brown);border-radius:999px;padding:7px;text-align:center;font-size:13px;font-weight:500;margin:8px 0 14px}
.askh{font:700 28px/1.15 var(--hand);margin:0 0 14px}
.pair{display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0 4px}
.pair .solo{width:130px}.solo svg{width:100%;display:block;overflow:visible}
.qbox{width:108px;height:112px;border:3px dashed #e6cf9f;border-radius:24px;display:grid;place-items:center;text-align:center;font-size:12px;color:#b08a4a;line-height:1.3;padding:8px}
.qbox b{display:block;font:700 40px/1 var(--hand)}
.hero{position:relative;background:#f8ecc6;border-radius:22px;padding:12px 10px 12px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4px;min-height:200px;overflow:hidden}
.hero.x{background:linear-gradient(160deg,#e3f1e4,#fde7e7)}
.hero .cp{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero .rt{display:grid;gap:8px;justify-items:start;align-self:start;padding-top:4px}
.sbadge{background:var(--brown);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 11px}
.bubble{background:#fff;border:2px solid var(--brown);border-radius:16px;padding:8px 10px;font-size:13px;line-height:1.45;position:relative;min-height:44px;width:100%;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-8px;top:16px;width:12px;height:12px;background:#fff;border-left:2px solid var(--brown);border-bottom:2px solid var(--brown);transform:rotate(45deg)}
.poke{position:absolute;left:12px;bottom:5px;font-size:11px;color:#b5935a}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fh{position:absolute;width:18px;height:18px;animation:rise 2.2s ease-out forwards}
.fh svg{width:100%;height:100%;display:block}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
.grow{border:2px solid var(--line);border-radius:18px;padding:12px 12px 10px;margin:12px 0 16px}
.grow ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.grow ol::before{content:"";position:absolute;left:10%;right:10%;top:9px;height:3px;background:#f1e6cf;border-radius:3px}
.grow .bar{position:absolute;left:10%;top:9px;height:3px;background:var(--leaf);border-radius:3px}
.grow li{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--soft);position:relative;text-align:center;line-height:1.25}
.grow li i{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #f1e6cf;display:block}
.grow li.done i{background:var(--leaf);border-color:var(--leaf)}
.grow li.cur{color:var(--ink);font-weight:700}.grow li.cur i{border-color:var(--leaf);box-shadow:0 0 0 4px #dcefd8}
.grow p{margin:8px 0 0;font-size:12px;text-align:center;color:var(--soft)}
.quote{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 16px 12px;margin:0 0 16px;font:400 20px/1.45 var(--hand);white-space:pre-line;overflow-wrap:anywhere}
.quote cite{display:block;font:400 12px var(--sans);color:var(--soft);margin-top:6px;font-style:normal}
.sec{margin:0 0 18px}
.lh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}
.lh b{font-size:15px}
.ent{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.ent .et{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--soft);flex-wrap:wrap}
.ent h4{margin:2px 0 0;font-size:15px;overflow-wrap:anywhere}
.ent p{margin:0;font-size:13px;color:#5e4d45;overflow-wrap:anywhere;white-space:pre-line}
.ent .stp1{grid-row:2/4;grid-column:2;align-self:start;width:56px;height:56px;border-radius:50%;border:2px dashed #e6c77f;background:var(--nmc);padding:3px;display:grid;place-items:center}
.ent .stp1 svg{width:100%;height:auto;display:block}
.ent .foot{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.k-own{background:#fff1c9;color:#8a5d0c}.k-story{background:var(--pkc);color:#c34a68}.k-fix{background:#e8f2e3;color:#3f7a3a}.k-note{background:var(--blc);color:#3d6bb5}.k-song{background:#efe4fb;color:#6b45a8}
.strip{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.strip .tile{width:68px;height:68px;aspect-ratio:auto;border-radius:10px}
.strip .more{display:grid;place-items:center;width:68px;height:68px;border-radius:10px;background:var(--line);border:0;font-size:13px}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--line);display:block;width:100%}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile .vbadge,.pv .vbadge{position:absolute;right:6px;bottom:6px;background:rgba(20,16,14,.7);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px}
.song-card{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:grid}
.yt{position:relative;aspect-ratio:16/9;background:#111}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{position:absolute;inset:0;border:0;padding:0;background:#111;display:block;width:100%}
.yt-play img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.yt-btn{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(20,16,14,.72);display:grid;place-items:center}
.yt-btn::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.song-meta{padding:12px 14px 14px;display:grid;gap:4px}
.song-who{font-size:12px;font-weight:700;color:#6b45a8}
.song-meta h3{margin:0;font-size:16px}
.song-meta p{margin:0;font-size:13px;color:var(--soft);white-space:pre-line}
.playlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.pl-item{width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px}
.pl-item[aria-current=true]{border-color:#b79be0}
.pl-item img{width:56px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}
.pl-item b{display:block;font-size:13px}.pl-item span{font-size:11px;color:var(--soft)}.pl-item time{font-size:11px;color:var(--soft)}
.visit{background:#fff;border:2px dashed #e6c77f;border-radius:18px;padding:14px;margin-bottom:14px;font-size:14px;display:grid;gap:10px}
.ctaw{position:sticky;bottom:0;padding:16px 0 calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,250,243,0),var(--app) 40%);margin-top:auto;z-index:3}
.layer{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:20;pointer-events:none}
.layer.on{pointer-events:auto;background:rgba(45,28,22,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--app);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:3px;background:#ead8bb;margin:0 auto 10px}
.shh{display:flex;align-items:center;gap:8px;margin-bottom:12px}.shh b{font-size:16px}.shh .r{margin-left:auto;font-size:13px;color:var(--soft)}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stp{border:2px solid transparent;background:#fff;border-radius:14px;padding:4px 2px 5px;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:700;min-height:44px}
.stp svg{width:78%;display:block}
.stp[aria-pressed=true]{border:2px dashed var(--nmd);background:var(--nmc)}
.shact{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:6px}
.mlist{display:grid;gap:8px;margin:6px 0 4px}
.mlist>button{min-height:48px;border-radius:14px;border:2px solid #efdccf;background:#fff;font-weight:700;font-size:14px;text-align:left;padding:0 14px}
.mlist p{margin:0;font-size:12px;color:var(--soft)}
.keybox{background:#fff;border:2px dashed #e9c76a;border-radius:14px;padding:10px 14px;font:700 15px ui-monospace,Menlo,monospace;word-break:break-all}
.bigcode{font:700 30px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;background:#fff;border:2px dashed var(--brown);border-radius:16px;padding:12px}
.picker{display:grid;gap:4px;justify-items:center;text-align:center;border:2px dashed #efdcb8;border-radius:14px;padding:16px;cursor:pointer;background:#fff;color:var(--soft);font-size:13px;position:relative}
.picker b{color:var(--ink);font-size:14px}
.picker input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.picker.drag{border-color:var(--nmd);background:var(--nmc)}
.previews{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.pv{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.pv img,.pv video{width:100%;height:100%;object-fit:cover;display:block}
.pv button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(20,16,14,.72);color:#fff;font-size:15px;line-height:1}
.yt-preview{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px;background:#fff;margin-top:6px}
.yt-preview img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}
.yt-preview b{display:block;font-size:13px}.yt-preview span{font-size:11px;color:var(--soft)}
.progress{font-size:13px;color:var(--soft)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 28px);z-index:60;background:#fff;border:2px solid var(--brown);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.lv{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:40;background:rgba(45,28,22,.45);display:grid;place-items:center;padding:20px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.lv>div{background:var(--app);border-radius:24px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;animation:up .4s;width:100%;max-width:340px}
.lv .cp{width:190px}.lv h3{font:700 26px/1.15 var(--hand);margin:0}.lv p{margin:0 0 6px;font-size:14px;color:var(--soft)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(14,11,9,.92);display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);color:#f4ede4}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-stage{display:grid;place-items:center;min-height:0;position:relative}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-cap{text-align:center;font-size:14px;opacity:.9;padding-top:10px;margin:0}
.lb button{color:#f4ede4;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px}
.lb .lb-prev,.lb .lb-next{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;padding:0;font-size:20px}
.lb .lb-prev{left:4px}.lb .lb-next{right:4px}
.mono{font-family:ui-monospace,Menlo,monospace}
.small{font-size:13px}.soft{color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px;margin-bottom:14px}
.panel h2{margin:0;font-size:17px}
.fam{display:flex;justify-content:center;align-items:flex-end;gap:0;margin:8px 0 4px}
.fam .n{width:150px}.fam .h{width:220px}
.famcards{display:grid;gap:12px;margin:14px 0 18px}
.famcard{border-radius:24px;padding:16px;display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:center}
.famcard.n{background:var(--nmc)}.famcard.h{background:var(--pkc)}
.famcard .pic{grid-row:1/4}
.famcard b{font:700 26px/1 var(--hand)}
.famcard small{font-size:13px;color:#6a5850;line-height:1.45}
.famcard .go{grid-column:1/-1;margin-top:8px}
.opener{display:grid;grid-template-columns:1fr auto;gap:8px;grid-column:1/-1;margin-top:8px}
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.steps li>i{width:30px;height:30px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font:700 16px var(--hand);font-style:normal}
.steps b{display:block;font-size:14px}.steps span{font-size:13px;color:var(--soft)}
.dcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:18px}
.dcards.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.dc{background:var(--nmc);border:0;border-radius:16px;padding:6px 4px 8px;display:grid;justify-items:center;gap:0;text-align:center}
.dc:nth-child(even){background:#fff6e0}
.dc .cp{width:100%}.dc b{font:700 17px var(--hand)}.dc small{font-size:10px;color:var(--soft)}
.dc .cp *{animation-play-state:paused!important}
.dc:hover .cp *,.dc.on .cp *{animation-play-state:running!important}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:grid}
.stat b{font:700 30px/1.1 var(--hand)}.stat span{font-size:12px;color:var(--soft)}
.genrow{display:grid;grid-template-columns:8rem 1fr auto;gap:10px;align-items:end}
.genrow .field{margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;align-content:start}
.card.fresh{border-color:var(--nmd);box-shadow:0 0 0 2px var(--nmd) inset}
.card .qr{background:#fff;border-radius:10px;aspect-ratio:1}
.card .qr svg{display:block;width:100%;height:100%}
.card .meta{display:grid;gap:2px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.s-new{background:#efe6da;color:#7d6a60}.pill.s-own{background:#e6f4e3;color:#3f7a3a}.pill.s-move{background:#fff1c9;color:#8a5d0c}
.empty{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--soft);font-size:13px}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.lights{position:fixed;top:0;left:0;right:0;height:44px;z-index:3;pointer-events:none}
.lights svg{display:block;width:100%;height:44px}
.bulb{animation:twinkle 2.4s ease-in-out infinite}.bulb:nth-child(3n){animation-delay:.8s}.bulb:nth-child(3n+1){animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
body.xmas .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 58px)}
.print-area{display:none}
.cp svg{width:100%;height:auto;display:block;overflow:visible}
.homehero{display:grid;justify-items:center;text-align:center;gap:2px;margin:6px 0 18px}
.homehero .cp{width:200px}
.logo{font:700 54px/1 var(--hand);margin:4px 0 0;letter-spacing:.12em}
.homehero .tag{font:700 22px var(--hand);margin:4px 0 0}
.famgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.fam2{border-radius:22px;padding:12px 10px 14px;display:grid;justify-items:center;gap:4px;text-align:center;text-decoration:none;color:var(--ink)}
.fam2.n{background:#eef3e4}.fam2.h{background:#fde9ee}
.fam2 .cp{width:100%;max-width:150px}
.fam2 b{font:700 24px/1 var(--hand);margin-top:2px}
.pill2{background:var(--brown);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 14px}
.fam2 small{font-size:12px;color:#6a5850}
.opener{display:grid;grid-template-columns:1fr auto;gap:8px}
.wake{width:190px;margin:4px auto 0}
.hello{border:2px solid var(--brown);border-radius:999px;padding:8px 14px;text-align:center;font-size:14px;margin:6px 0 18px}
.ment{background:#fff;border:2px solid #f0e2c8;border-radius:18px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:72px 1fr 50px;gap:12px;align-items:center}
.ment.nothumb{grid-template-columns:1fr 50px}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;border:2px solid var(--brown);padding:0;background:var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cnt{position:absolute;right:3px;bottom:3px;background:rgba(20,16,14,.7);color:#fff;font-size:10px;border-radius:999px;padding:0 6px}
.mt time{font-size:12px;color:var(--soft)}
.mt h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.mt p{margin:2px 0 0;font-size:13px;color:#5e4d45;white-space:pre-line;overflow-wrap:anywhere}
.mst{width:50px;border:0;background:none;padding:0;align-self:start}
.mst svg{width:100%;display:block}
.ytbox{grid-column:1/-1}
.ytbox:empty{display:none}
.ta{position:relative;margin:8px 0}
.ta textarea{padding-right:70px;min-height:110px}
.taprev{position:absolute;right:8px;top:8px;width:56px}.taprev svg{width:100%;display:block}
.phs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.addph{border:2px solid var(--brown);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;min-height:44px;display:inline-flex;align-items:center}
.phs .pv{width:64px;height:48px;aspect-ratio:auto;border:2px solid var(--brown)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 8px}.lbl b{font-size:14px}.lbl small{font-size:12px;color:var(--soft)}
.stp span{font-size:11px;font-weight:500;color:#6a5850}
.stp svg{width:70%}
.stp[aria-pressed=true]{border:2px dashed var(--pkd);background:var(--pkc)}
.hand{font:700 22px var(--hand)}
.dcards.four{grid-template-columns:repeat(4,minmax(0,1fr))}

.an-kissB .bb{--ld:-5px;--lr:-3deg}

.an-huff .bob{animation:huff 1.8s ease-in-out infinite}

.an-huff .hm{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.an-huff .hm:nth-of-type(2){animation-delay:.2s}.an-huff .hm:nth-of-type(3){animation-delay:.4s}

.an-sniff .bob{animation:sniff 1.3s ease-in-out infinite}
@keyframes sniff{50%{transform:translateY(1.5px) scale(1.015,.985)}}
.an-sniff .lt{animation:flt 2.4s ease-in-out infinite}

.an-drift .bp{animation:drP 3.4s ease-in-out infinite}.an-drift .bb{animation:drB 3.4s ease-in-out infinite}

.an-jump .bob{animation:jump 1s ease-in-out infinite}

.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.tw:nth-of-type(2n){animation-delay:.5s}
@keyframes tw{50%{transform:scale(.7);opacity:.6}}
.cf{animation:cf 2.6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
.cf:nth-of-type(3n){animation-delay:-.9s}.cf:nth-of-type(3n+1){animation-delay:-1.7s}
@keyframes cf{0%{transform:translateY(-6px) rotate(0)}100%{transform:translateY(10px) rotate(180deg)}}
.meet .mp{animation:inL 1.1s cubic-bezier(.3,1.35,.5,1) both}.meet .mb{animation:inR 1.1s cubic-bezier(.3,1.35,.5,1) both}

.an-sway .bn{animation:swP 3.2s ease-in-out infinite}
.an-bounce .bn{animation:hop .75s ease-in-out infinite}
.an-drift .bn{animation:drP 3.4s ease-in-out infinite}
.an-sing .bn{animation:swP 1.6s ease-in-out infinite}.an-sing .nt{animation:flt 1.6s ease-in-out infinite}.an-sing .nt:nth-of-type(2){animation-delay:.5s}
.an-ouch .bn{animation:huff 1.8s ease-in-out infinite}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.genrow{grid-template-columns:1fr}.search{max-width:none;flex:1 1 100%}}

 .pcell span{font-size:8pt;color:#444}
}

async function renderAdmin() {

  const genMsg = h("p", { class: "small", hidden: true });

    if (state.filter === "move" && !t.transfer_pending) return false;
    const q = state.search;
    if (!q) return true;
    return [t.id, t.item, t.owner_name, t.label].some(v => (v || "").toLowerCase().includes(q));
  });
  const segBtns = [["all", "전체"], ["new", "미등록"], ["own", "주인 있음"], ["move", "양도 중"]].map(([k, label]) =>
    h("button", { type: "button", "aria-pressed": String(k === state.filter), "data-k": k,
      onclick: () => { state.filter = k; segBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k))); paint(); } }, label));
  function statusOf(t) {
    if (t.transfer_pending) return ["s-move", "양도 중"];

  function card(t) {

      h("div", { class: "qr", html: qrSvg(tagUrl(t.id)) }),
      h("div", { class: "spread" }, h("b", { class: "mono" }, "#" + t.id), h("span", { class: "pill " + cls }, label)),
      h("div", { class: "meta" },

        h("span", { class: "soft small" }, (t.label ? t.label + " · " : "") + new Date(t.created_at).toLocaleDateString("ko-KR"))),

        h("a", { class: "btn small", href: tagUrl(t.id), target: "_blank", rel: "noopener" }, "페이지 열기"),

        h("button", { class: "btn small ghost", type: "button", onclick: () => copy(tagUrl(t.id)) }, "주소 복사"),
        del));

      h("div", { class: "stat" }, h("b", null, all.length), h("span", null, "전체 태그")),

      try {

        genMsg.hidden = false; genMsg.className = "okmsg";
        genMsg.textContent = "새 QR " + made.length + "개와 각각의 페이지를 만들었어요. 테두리가 강조된 카드가 방금 만든 것이에요.";
      } catch (err) {
        genMsg.hidden = false; genMsg.className = "err"; genMsg.textContent = errMsg(err);
      }
    });
  } },
    h("div", { class: "genrow" },
      field("만들 개수", genCount, { hint: "한 번에 1~100개" }),
      field("묶음 이름", genLabel, { hint: "선택. 어디에 붙일 태그인지 메모" }),
      genBtn),
    genMsg);
  mount(
    topline(h("span", { class: "row" },
      h("span", null, DB.mode === "demo" ? "체험 모드" : session.email),
      DB.mode === "live" ? h("button", { class: "btn small ghost", type: "button", onclick: async () => { await DB.signOut(); renderAdmin(); } }, "로그아웃") : null)),
    h("div", { class: "spread" }, h("h1", { class: "big" }, "관리자"), h("a", { href: homeUrl(), class: "small" }, "서비스 첫 화면 보기")),
    demoNotice("QR에 담기는 주소: " + baseUrl() + "?t=코드"),
    statsEl,
    h("section", { class: "panel" }, h("h2", null, "새 QR 만들기"), genForm),
    h("section", { class: "panel" },
      h("div", { class: "toolbar" },
        h("div", { class: "row" }, h("div", { class: "seg tseg", role: "group", "aria-label": "상태로 거르기" }, segBtns), countEl),
        h("div", { class: "row", style: "flex:1 1 260px;justify-content:flex-end" },
          search,
          h("button", { class: "btn ghost", type: "button", onclick: () => { const l = visible(); if (l.length) printTags(l); else toast("인쇄할 태그가 없어요"); } }, "보이는 QR 인쇄"))),
      gridEl));
  statsEl.replaceChildren(h("p", { class: "soft" }, "불러오는 중…"));

  catch (e) { gridEl.replaceChildren(h("p", { class: "err" }, errMsg(e))); }

function renderLogin() {
  const email = h("input", { id: "login-email", type: "email", autocomplete: "username", required: true });
  const pw = h("input", { id: "login-pw", type: "password", autocomplete: "current-password", required: true });

  const btn = h("button", { class: "btn", type: "submit" }, "로그인");
  app.className = "wrap";
  setTheme("basic");
  mount(topline(null), h("section", { class: "panel" },
    h("h2", null, "관리자 로그인"),
    h("p", { class: "soft small" }, "Supabase에서 만든 관리자 계정으로 로그인하세요."),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      await busy(btn, async () => {
        try { await DB.signIn(email.value.trim(), pw.value); renderAdmin(); }
        catch (err) { msg.hidden = false; msg.textContent = errMsg(err); }
      });
    } }, field("이메일", email), field("비밀번호", pw), msg, h("div", null, btn))));
