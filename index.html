<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 도착 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14202b; --muted:#5b6876; --accent:#1f6feb; --line:#d6dde4;
  --display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f151b; --surface:#17202a; --fg:#e7edf3; --muted:#9aa8b6; --accent:#5b9cff; --line:#273340; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px}
main{max-width:520px;margin:0 auto;display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:grid;gap:18px}
.finder{width:56px;height:56px;border:8px solid var(--fg);border-radius:6px;display:grid;place-items:center}
.finder::after{content:"";width:16px;height:16px;background:var(--accent);border-radius:2px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
a{color:var(--accent);overflow-wrap:anywhere}
.code{font-family:var(--mono);color:var(--fg)}
.list{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px;margin:0;padding-left:0;list-style:none}
.list li{display:grid;grid-template-columns:7rem 1fr;gap:12px;min-width:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="card" id="going" hidden>
    <div class="finder" aria-hidden="true"></div>
    <h1>이동 중이에요</h1>
    <p>잠시 후 자동으로 이동합니다. 이동하지 않으면 <a id="manual" href="#">여기를 누르세요</a>.</p>
  </div>
  <div class="card" id="missing" hidden>
    <div class="finder" aria-hidden="true"></div>
    <h1>등록되지 않은 QR코드예요</h1>
    <p>코드 <span class="code" id="badcode"></span>에 연결된 주소가 없습니다.</p>
  </div>
  <div class="card" id="home" hidden>
    <div class="finder" aria-hidden="true"></div>
    <h1>QR 연결 서비스</h1>
    <p>QR코드마다 다른 웹사이트로 연결됩니다. 지금 등록된 코드는 아래와 같아요.</p>
    <ul class="list" id="list"></ul>
  </div>
</main>
<script>
const code=new URLSearchParams(location.search).get('c');
const show=id=>document.getElementById(id).hidden=false;
fetch('links.json',{cache:'no-store'}).then(r=>r.json()).then(links=>{
  if(code){
    const url=links[code];
    if(url){
      document.getElementById('manual').href=url;
      show('going');
      location.replace(url);
    }else{
      document.getElementById('badcode').textContent=code;
      show('missing');
    }
    return;
  }
  const list=document.getElementById('list');
  for(const [k,url] of Object.entries(links)){
    const li=document.createElement('li');
    const c=document.createElement('span');c.className='code';c.textContent=k;
    const a=document.createElement('a');a.href=url;a.textContent=url;
    li.append(c,a);list.append(li);
  }
  show('home');
}).catch(()=>{
  document.getElementById('badcode').textContent=code||'';
  show('missing');
});
</script>
</body>
</html>
