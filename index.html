.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : String(k));
  }
  return el;
}

function field(label, control, opts = {}) {
  const id = control.id;
  return h("div", { class: "field" },
    h("label", { for: id }, label, opts.req ? h("span", { class: "req", "aria-hidden": "true" }, "*") : null),
    control,
    opts.hint ? h("span", { class: "hint" }, opts.hint) : null);
}

function choices(name, items, value) {
  return h("div", { class: "choices", role: "radiogroup" },
    items.map(([v, label]) => h("label", null,
      h("input", { type: "radio", name, value: v, checked: v === value, id: name + "-" + v }), label)));
}

function randomFrom(alpha, n) {
  const a = new Uint32Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, x => alpha[x % alpha.length]).join("");
}
const randomId = () => randomFrom(ALPHA, 7);
const randomToken = () => randomFrom(ALPHA + "ABCDEFGHJKLMNPQRSTUVWXYZ", 32);
const randomCode = () => randomFrom("ABCDEFGHJKLMNPQRSTUVWXYZ23456789", 8);

async function sha(text) {
  const data = new TextEncoder().encode(String(text));
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
  }
  let x = 2166136261;
  for (const b of data) { x ^= b; x = Math.imul(x, 16777619) >>> 0; }
  return "f" + x.toString(16);
}

};

function errMsg(e) {
  const m = String(e && e.message || e || "");

  if (/fetch|network|Failed/i.test(m)) return ERR.network;

}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("복사했어요"); }
  catch {
    const ta = h("textarea", { style: "position:fixed;opacity:0" });
    ta.value = text; document.body.append(ta); ta.select();

    ta.remove();
  }
}

async function busy(btn, fn) {

function sortEntries(list) {
  return list.slice().sort((a, b) =>
    (a.happened_on || "").localeCompare(b.happened_on || "") || (a.created_at || "").localeCompare(b.created_at || ""));
}

const Local = {
  mode: "demo",
  load() {
    try { return JSON.parse(store.get("memtag-demo")) || { tags: {}, entries: [], secrets: {} }; }
    catch { return { tags: {}, entries: [], secrets: {} }; }
  },
  save(d) { store.set("memtag-demo", JSON.stringify(d)); },
  blank(id, label) {
    return { id, label: label || "", item: "", spec: "", owner_name: "", owner_count: 0, theme: "basic",
      transfer_pending: false, created_at: new Date().toISOString(), claimed_at: null };
  },
  entry(id, kind, title, body, when) {
    return { id: randomId(), tag_id: id, kind, title, body: body || "", happened_on: when || monthNow(), created_at: new Date().toISOString() };
  },
  async session() { return { email: "체험 모드" }; },
  async isAdmin() { return true; },
  async signIn() {},
  async signOut() {},
  async listTags() {
    return Object.values(this.load().tags).sort((a, b) => b.created_at.localeCompare(a.created_at));
  },
  async createTags(n, label) {
    const d = this.load(), out = [];
    for (let i = 0; i < n; i++) {
      let id; do { id = randomId(); } while (d.tags[id]);
      const t = this.blank(id, label);
      t.created_at = new Date(Date.now() + i).toISOString();
      d.tags[id] = t; out.push(t);
    }
    this.save(d);
    return out;
  },
  async deleteTag(id) {
    const d = this.load();
    delete d.tags[id]; delete d.secrets[id];
    d.entries = d.entries.filter(e => e.tag_id !== id);
    this.save(d);
  },
  async getTag(id) {
    const d = this.load();
    let t = d.tags[id], auto = false;
    if (!t) {
      if (!/^[a-z0-9]{4,16}$/.test(id)) return null;
      t = d.tags[id] = this.blank(id, "체험");
      this.save(d); auto = true;
    }
    return { tag: t, entries: sortEntries(d.entries.filter(e => e.tag_id === id)), auto };
  },
  async isOwner(id, tok) {
    const s = this.load().secrets[id];
    return !!(tok && s && s.owner_hash && s.owner_hash === await sha(tok));
  },
  async check(d, id, tok) {
    const s = d.secrets[id];
    if (!(tok && s && s.owner_hash === await sha(tok))) throw new Error("bad_token");
  },
  async claim(id, f, tok) {
    const d = this.load(), t = d.tags[id];
    if (!t) throw new Error("no_tag");
    if (t.owner_count > 0) throw new Error("already_claimed");
    Object.assign(t, { item: f.item.trim(), spec: f.spec.trim(), owner_name: f.owner.trim(), owner_count: 1,
      theme: f.theme === "xmas" ? "xmas" : "basic", claimed_at: new Date().toISOString() });
    d.secrets[id] = { owner_hash: await sha(tok) };
    d.entries.push(this.entry(id, "소유", "초대 주인이 이야기를 시작했어요", f.story, f.since || monthNow()));
    this.save(d);
  },
  async addEntry(id, tok, f) {
    const d = this.load();
    await this.check(d, id, tok);
    if (!["사연", "수리", "기록"].includes(f.kind)) throw new Error("bad_kind");
    d.entries.push(this.entry(id, f.kind, f.title.trim(), f.body, f.date || monthNow()));
    this.save(d);
  },
  async updateTag(id, tok, f) {
    const d = this.load();
    await this.check(d, id, tok);
    Object.assign(d.tags[id], { item: f.item.trim(), spec: f.spec.trim(), theme: f.theme === "xmas" ? "xmas" : "basic" });
    this.save(d);
  },
  async startTransfer(id, tok) {
    const d = this.load();
    await this.check(d, id, tok);
    const code = randomCode();
    Object.assign(d.secrets[id], { transfer_hash: await sha(code), transfer_expires: Date.now() + 7 * 864e5 });
    d.tags[id].transfer_pending = true;
    this.save(d);
    return code;
  },
  async cancelTransfer(id, tok) {
    const d = this.load();
    await this.check(d, id, tok);
    Object.assign(d.secrets[id], { transfer_hash: null, transfer_expires: null });
    d.tags[id].transfer_pending = false;
    this.save(d);
  },
  async acceptTransfer(id, code, owner, story, tok) {
    const d = this.load(), s = d.secrets[id], t = d.tags[id];
    if (!(s && s.transfer_hash && s.transfer_hash === await sha(code.trim().toUpperCase()) && s.transfer_expires > Date.now())) throw new Error("bad_code");
    t.owner_name = owner.trim(); t.owner_count += 1; t.transfer_pending = false;
    Object.assign(s, { owner_hash: await sha(tok), transfer_hash: null, transfer_expires: null });
    d.entries.push(this.entry(id, "소유", t.owner_count + "번째 주인에게 양도되었어요", story));
    this.save(d);
    return t.owner_count;
  }
};

    if (error) throw new Error(error.message);
    return data;
  },
  async q(p) {
    const { data, error } = await p;
    if (error) { const e = new Error(error.message); e.code = error.code; throw e; }
    return data;
  },

    const { data } = await this.client.auth.getSession();

  },

  async signIn(email, password) {

    if (error) throw new Error("login");
  },
  async signOut() { await this.client.auth.signOut(); },
  async listTags() { return this.q(this.client.from("tags").select("*").order("created_at", { ascending: false })); },
  async createTags(n, label, tries = 0) {
    const rows = Array.from({ length: n }, () => ({ id: randomId(), label: label || "" }));
    try { return await this.q(this.client.from("tags").insert(rows).select()); }
    catch (e) { if (e.code === "23505" && tries < 3) return this.createTags(n, label, tries + 1); throw e; }
  },
  async deleteTag(id) { await this.q(this.client.from("tags").delete().eq("id", id)); },
  async getTag(id) {

  async isOwner(id, tok) { return tok ? !!(await this.rpc("is_owner", { p_id: id, p_token: tok })) : false; },
  async claim(id, f, tok) {

  async acceptTransfer(id, code, owner, story, tok) {
    return this.rpc("accept_transfer", { p_id: id, p_code: code, p_owner: owner, p_story: story, p_token: tok });
  }
};

function qrMatrix(text) {
  const q = qrcode(0, "M");
  q.addData(text);
  q.make();
  return q;
}

function qrSvg(text) {
  const q = qrMatrix(text), n = q.getModuleCount(), m = 4, size = n + m * 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

function qrPng(id) {
  const q = qrMatrix(tagUrl(id)), n = q.getModuleCount(), s = 12, m = 4, w = (n + m * 2) * s, cap = 84;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = w + cap;
  const x = cv.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + m) * s, (r + m) * s, s, s);
  x.textAlign = "center";
  x.font = "600 30px 'IBM Plex Mono', monospace";
  x.fillText("#" + id, w / 2, w + 22);
  x.fillStyle = "#555";
  x.font = "20px 'Noto Sans KR', sans-serif";
  x.fillText("찍으면 이 물건의 이야기가 열려요", w / 2, w + 58);
  return cv.toDataURL("image/png");
}

let snowStop = null;
function setTheme(theme) {
  const on = theme === "xmas";
  document.body.classList.toggle("xmas", on);
  $(".lights")?.remove();
  $("#snow")?.remove();
  if (snowStop) { snowStop(); snowStop = null; }
  if (!on) return;
  const colors = ["#e23b3b", "#f2c94c", "#3fbf6b", "#5aa9ff"];
  let bulbs = "";
  for (let i = 0; i < 16; i++) bulbs += '<ellipse class="bulb" cx="' + (25 + i * 50) + '" cy="22" rx="6" ry="9" fill="' + colors[i % 4] + '"/>';
  document.body.prepend(h("div", { class: "lights", "aria-hidden": "true",
    html: '<svg viewBox="0 0 800 44" preserveAspectRatio="none"><path d="M0 8 Q 50 30 100 8 T 200 8 T 300 8 T 400 8 T 500 8 T 600 8 T 700 8 T 800 8" fill="none" stroke="#2c4a3b" stroke-width="2"/><g>' + bulbs + "</g></svg>" }));
  const cv = h("canvas", { id: "snow", "aria-hidden": "true" });
  document.body.prepend(cv);
  const ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, flakes = [], raf = 0, alive = true;
  const size = () => {
    const r = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0);
    flakes = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2.4 + .8, s: Math.random() * .6 + .3, d: Math.random() * 6.28 }));
  };
  const draw = () => {
    if (!alive) return;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
      if (!still) { f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .4; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } }
    }
    if (!still) raf = requestAnimationFrame(draw);
  };
  const onResize = () => { size(); if (still) draw(); };
  addEventListener("resize", onResize);
  size(); draw();
  snowStop = () => { alive = false; cancelAnimationFrame(raf); removeEventListener("resize", onResize); };
}

        genMsg.textContent = "새 QR " + made.length + "개와 각각의 페이지를 만들었어요. 테두리가 강조된 카드가 방금 만든 것이에요.";
      } catch (err) {
        genMsg.hidden = false; genMsg.className = "err"; genMsg.textContent = errMsg(err);
      }
    });
  } },
    h("div", { class: "genrow" },
      field("만들 개수", genCount, { hint: "한 번에 1~100개" }),
      field("묶음 이름", genLabel, { hint: "선택. 어디에 붙일 태그인지 메모" }),
      genBtn),
    genMsg);

  mount(
    topline(h("span", { class: "row" },
      h("span", null, DB.mode === "demo" ? "체험 모드" : session.email),
      DB.mode === "live" ? h("button", { class: "btn small ghost", type: "button", onclick: async () => { await DB.signOut(); renderAdmin(); } }, "로그아웃") : null)),
    h("div", { class: "spread" }, h("h1", { class: "home-h1", style: "font-size:1.8rem" }, "관리자"), h("a", { href: homeUrl(), class: "small" }, "서비스 첫 화면 보기")),
    demoNotice("QR에 담기는 주소: " + baseUrl() + "?t=코드"),
    statsEl,
    h("section", { class: "panel" }, h("h2", null, "새 QR 만들기"), genForm),
    h("section", { class: "panel" },
      h("div", { class: "toolbar" },
        h("div", { class: "row" }, h("div", { class: "seg", role: "group", "aria-label": "상태로 거르기" }, segBtns), countEl),
        h("div", { class: "row", style: "flex:1 1 260px;justify-content:flex-end" },
          search,
          h("button", { class: "btn ghost", type: "button", onclick: () => { const l = visible(); if (l.length) printTags(l); else toast("인쇄할 태그가 없어요"); } }, "보이는 QR 인쇄"))),
      gridEl));
  statsEl.replaceChildren(h("p", { class: "muted" }, "불러오는 중…"));
  try { state.tags = await DB.listTags(); paint(); }
  catch (e) { gridEl.replaceChildren(h("p", { class: "err" }, errMsg(e))); }
}

function renderLogin() {
  const email = h("input", { id: "login-email", type: "email", autocomplete: "username", required: true });
  const pw = h("input", { id: "login-pw", type: "password", autocomplete: "current-password", required: true });
  const msg = h("p", { class: "err", hidden: true });
  const btn = h("button", { class: "btn", type: "submit" }, "로그인");
  app.className = "wrap";
  mount(topline(null), h("section", { class: "panel" },
    h("h2", null, "관리자 로그인"),
    h("p", { class: "muted small" }, "Supabase에서 만든 관리자 계정으로 로그인하세요."),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      await busy(btn, async () => {
        try { await DB.signIn(email.value.trim(), pw.value); renderAdmin(); }
        catch (err) { msg.hidden = false; msg.textContent = errMsg(err); }
      });
    } }, field("이메일", email), field("비밀번호", pw), msg, h("div", null, btn))));
}

function renderFatal(text) {
  setTheme("basic");
  app.className = "wrap";
  mount(topline(null), h("section", { class: "panel" }, h("h2", null, "페이지를 열 수 없어요"), h("p", { class: "muted" }, text)));
}

async function renderTag(id, flash) {
  let data;
  try { data = await DB.getTag(id); } catch (e) { return renderFatal(errMsg(e)); }
  if (!data) {
    setTheme("basic");
    app.className = "wrap";
    mount(topline(null), h("section", { class: "panel" },
      h("h2", null, "등록되지 않은 태그예요"),
      h("p", { class: "muted" }, "#" + id + " 코드로 만든 태그가 없어요. QR이 훼손됐거나 삭제된 태그일 수 있어요.")));
    return;
  }
  const { tag, entries } = data;
  document.title = (tag.item || "새 기억 태그") + " · 물건 기억 태그";
  setTheme(tag.theme);
  app.className = "wrap";
  if (tag.owner_count === 0) return renderClaim(tag, data.auto);

  const tok = keyOf(id);
  let owner = false;
  try { owner = await DB.isOwner(id, tok); } catch {}

  const first = entries.find(e => e.body && e.body.trim());
  const nth = tag.owner_count === 1 ? "초대 주인" : tag.owner_count + "번째 주인";

  const parts = [
    topline(h("span", { class: "season" }, tag.theme === "xmas" ? "Merry Christmas" : "#" + tag.id)),
    flash || null,
    h("section", { class: "hero" },
      h("span", { class: "ribbon" }, tag.owner_count === 1 ? (tag.theme === "xmas" ? "따끈따끈 신상" : "첫 번째 이야기") : tag.owner_count + "번째 이야기"),
      h("span", { class: "eyebrow" }, "기억 태그 #" + tag.id),
      h("h1", null, tag.item),
      tag.spec ? h("p", { class: "spec" }, tag.spec) : null,
      h("div", { class: "owner" }, h("b", null, (tag.owner_count === 1 ? "초대 주인 " : "현재 주인 ") + tag.owner_name), h("span", { class: "badge" }, nth))),
    first ? h("blockquote", null, first.body) : null,
    h("section", { style: "display:grid;gap:6px" },
      h("h2", { class: "sec-title" }, "이 물건의 기록"),
      h("ol", { class: "timeline" }, entries.map(e => h("li", { class: "ev k-" + (KIND[e.kind] || "own") },
        h("time", null, e.happened_on),
        h("div", null, h("span", { class: "chip" }, e.kind), h("h3", null, e.title), e.body ? h("p", null, e.body) : null))))),
  ];

  if (owner) parts.push(...ownerPanels(tag, tok));
  else if (tag.transfer_pending) parts.push(acceptPanel(tag));
  if (!owner) parts.push(keyPanel(tag));
  parts.push(h("p", { class: "muted small" }, "이전 주인의 이름은 공개되지 않고 사연만 남습니다."));
  mount(...parts);
}

function renderClaim(tag, auto) {
  const item = h("input", { id: "c-item", maxlength: "60", required: true, placeholder: "예: 어쿠스틱 기타" });
  const spec = h("input", { id: "c-spec", maxlength: "80", placeholder: "예: 드레드노트 바디, 스프루스 상판" });
  const ownerIn = h("input", { id: "c-owner", maxlength: "30", required: true, placeholder: "예: 김현우" });
  const since = h("input", { id: "c-since", type: "month", value: monthValue() });
  const story = h("textarea", { id: "c-story", maxlength: "1000", required: true, placeholder: "이 물건과 함께한 첫 이야기를 적어 주세요. 예: 친구 결혼식에서 이 기타로 축가를 불렀어요." });
  const msg = h("p", { class: "err", hidden: true });
  const btn = h("button", { class: "btn", type: "submit" }, "이 물건의 초대 주인 되기");
  mount(
    topline(h("span", null, "#" + tag.id)),
    demoNotice(auto ? "이 기기에서 처음 연 태그라 체험용으로 새로 만들었어요." : null),
    h("section", { class: "hero" },
      h("span", { class: "ribbon" }, "새 태그"),
      h("span", { class: "eyebrow" }, "기억 태그 #" + tag.id),
      h("h1", null, "아직 주인이 없는 태그예요"),
      h("p", { class: "spec" }, "이 태그를 붙인 물건의 첫 이야기를 남겨 주세요. 처음 등록한 사람이 초대 주인이 돼요.")),
    h("section", { class: "panel" },
      h("form", { onsubmit: async e => {
        e.preventDefault();
        const theme = (app.querySelector("input[name=c-theme]:checked") || {}).value || "basic";
        const tok = randomToken();
        await busy(btn, async () => {
          try {
            await DB.claim(tag.id, { item: item.value, spec: spec.value, owner: ownerIn.value, since: monthInput(since.value), story: story.value, theme }, tok);
            setKey(tag.id, tok);
            renderTag(tag.id, keyNotice(tag.id, tok, true));
          } catch (err) { msg.hidden = false; msg.textContent = errMsg(err); }
        });
      } },
        field("물건 이름", item, { req: true }),
        field("한 줄 설명", spec, { hint: "모델, 색, 특징 등" }),
        h("div", { class: "two" }, field("내 이름 또는 닉네임", ownerIn, { req: true, hint: "다음 주인에게 넘기면 공개되지 않아요" }), field("언제부터 함께했나요", since)),
        field("첫 사연", story, { req: true }),
        h("div", { class: "field" }, h("span", { class: "lbl" }, "페이지 테마"), choices("c-theme", [["basic", "기본"], ["xmas", "크리스마스"]], "basic")),
        msg,
        h("div", null, btn))));
}

function keyNotice(id, tok, fresh) {
  return h("section", { class: "panel" },
    h("h2", null, fresh ? "등록 완료! 주인 열쇠를 꼭 저장하세요" : "주인 열쇠"),
    h("p", { class: "muted small" }, "이 기기에는 자동으로 저장됐어요. 폰을 바꾸거나 브라우저 기록을 지우면 이 열쇠가 있어야 다시 글을 쓰고 양도할 수 있어요. 메모 앱 등에 보관하세요."),
    h("div", { class: "keybox" }, tok),
    h("div", null, h("button", { class: "btn ghost small", type: "button", onclick: () => copy(tok) }, "열쇠 복사")));
}

function ownerPanels(tag, tok) {
  const id = tag.id;
  const kind = choices("e-kind", [["사연", "사연"], ["수리", "수리·정비"], ["기록", "메모"]], "사연");
  const date = h("input", { id: "e-date", type: "month", value: monthValue() });
  const title = h("input", { id: "e-title", maxlength: "80", required: true, placeholder: "예: 첫 버스킹 공연" });
  const body = h("textarea", { id: "e-body", maxlength: "1000", placeholder: "어떤 일이 있었나요?" });
  const eMsg = h("p", { class: "err", hidden: true });
  const eBtn = h("button", { class: "btn", type: "submit" }, "기록 남기기");
  const add = h("details", { class: "panel", open: true },
    h("summary", null, "새 기록 남기기"),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      const k = (app.querySelector("input[name=e-kind]:checked") || {}).value || "사연";
      await busy(eBtn, async () => {
        try { await DB.addEntry(id, tok, { kind: k, title: title.value, body: body.value, date: monthInput(date.value) }); toast("기록을 남겼어요"); renderTag(id); }
        catch (err) { eMsg.hidden = false; eMsg.textContent = errMsg(err); }
      });
    } },
      h("div", { class: "field" }, h("span", { class: "lbl" }, "종류"), kind),
      h("div", { class: "two" }, field("제목", title, { req: true }), field("언제", date)),
      field("내용", body),
      eMsg, h("div", null, eBtn)));

  const codeKey = "memtag-transfer-" + id;
  const tBox = h("div", { style: "display:grid;gap:12px" });
  const paintTransfer = () => {
    const saved = store.get(codeKey);
    if (tag.transfer_pending) {
      const cancel = h("button", { class: "btn ghost", type: "button" }, "양도 취소");
      cancel.addEventListener("click", () => busy(cancel, async () => {
        try { await DB.cancelTransfer(id, tok); store.del(codeKey); tag.transfer_pending = false; paintTransfer(); toast("양도를 취소했어요"); }
        catch (err) { toast(errMsg(err)); }
      }));
      const renew = h("button", { class: "btn ghost", type: "button" }, "새 코드 받기");
      renew.addEventListener("click", () => start(renew));
      tBox.replaceChildren(
        h("p", null, "새 주인에게 아래 코드를 알려 주세요. 새 주인이 이 태그를 찍고 코드를 넣으면 소유권이 넘어가요. 코드는 7일 동안 쓸 수 있어요."),
        saved ? h("div", { class: "bigcode" }, saved) : h("p", { class: "muted small" }, "코드는 만든 기기에서만 다시 볼 수 있어요. 잃어버렸다면 새 코드를 받으세요."),
        h("div", { class: "row" }, saved ? h("button", { class: "btn", type: "button", onclick: () => copy(saved) }, "코드 복사") : null, renew, cancel));
    } else {
      const go = h("button", { class: "btn", type: "button" }, "양도 코드 만들기");
      go.addEventListener("click", () => start(go));
      tBox.replaceChildren(
        h("p", { class: "muted" }, "이 물건을 팔거나 물려줄 때 쓰세요. 양도가 끝나면 이 기기의 주인 열쇠는 더 이상 쓸 수 없고, 내 이름은 기록에서 사라져요."),
        h("div", null, go));
    }
  };
  const start = btn => busy(btn, async () => {
    try { const code = await DB.startTransfer(id, tok); store.set(codeKey, code); tag.transfer_pending = true; paintTransfer(); }
    catch (err) { toast(errMsg(err)); }
  });
  paintTransfer();
  const transfer = h("details", { class: "panel", open: tag.transfer_pending },
    h("summary", null, tag.transfer_pending ? "양도 진행 중" : "양도하기"), tBox);

  const item = h("input", { id: "u-item", maxlength: "60", required: true, value: tag.item });
  const spec = h("input", { id: "u-spec", maxlength: "80", value: tag.spec || "" });
  const uMsg = h("p", { class: "err", hidden: true });
  const uBtn = h("button", { class: "btn", type: "submit" }, "저장");
  const edit = h("details", { class: "panel" },
    h("summary", null, "물건 정보와 테마 바꾸기"),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      const theme = (app.querySelector("input[name=u-theme]:checked") || {}).value || "basic";
      await busy(uBtn, async () => {
        try { await DB.updateTag(id, tok, { item: item.value, spec: spec.value, theme }); toast("저장했어요"); renderTag(id); }
        catch (err) { uMsg.hidden = false; uMsg.textContent = errMsg(err); }
      });
    } },
      field("물건 이름", item, { req: true }), field("한 줄 설명", spec),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "페이지 테마"), choices("u-theme", [["basic", "기본"], ["xmas", "크리스마스"]], tag.theme)),
      uMsg, h("div", null, uBtn)));

  const keyD = h("details", { class: "panel" }, h("summary", null, "내 주인 열쇠 보기"),
    h("p", { class: "muted small" }, "다른 기기에서 이 물건을 관리하려면 그 기기에서 이 열쇠를 입력하세요. 다른 사람에게 보여 주지 마세요."),
    h("div", { class: "keybox" }, tok),
    h("div", null, h("button", { class: "btn ghost small", type: "button", onclick: () => copy(tok) }, "열쇠 복사")));

  return [h("p", { class: "okmsg" }, "이 기기는 이 물건의 주인으로 인식됐어요."), add, transfer, edit, keyD];
}

function acceptPanel(tag) {
  const code = h("input", { id: "a-code", maxlength: "8", required: true, placeholder: "예: 7KQ2M9XA", autocomplete: "off", autocapitalize: "characters", class: "mono" });
  const ownerIn = h("input", { id: "a-owner", maxlength: "30", required: true });
  const story = h("textarea", { id: "a-story", maxlength: "1000", placeholder: "이 물건을 어떻게 만나게 됐나요?" });
  const msg = h("p", { class: "err", hidden: true });
  const btn = h("button", { class: "btn", type: "submit" }, "새 주인으로 받기");
  return h("section", { class: "panel" },
    h("h2", null, "이 물건은 지금 양도 중이에요"),
    h("p", { class: "muted small" }, "이전 주인에게 받은 8자리 양도 코드를 넣으면 새 주인이 돼요."),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      const tok = randomToken();
      await busy(btn, async () => {
        try {
          const n = await DB.acceptTransfer(tag.id, code.value.trim().toUpperCase(), ownerIn.value, story.value, tok);
          setKey(tag.id, tok);
          renderTag(tag.id, h("div", null, h("p", { class: "okmsg" }, n + "번째 주인이 되었어요."), keyNotice(tag.id, tok, true)));
        } catch (err) { msg.hidden = false; msg.textContent = errMsg(err); }
      });
    } },
      h("div", { class: "two" }, field("양도 코드", code, { req: true }), field("내 이름 또는 닉네임", ownerIn, { req: true })),
      field("나의 첫 이야기", story),
      msg, h("div", null, btn)));
}

function keyPanel(tag) {
  const key = h("input", { id: "k-key", required: true, autocomplete: "off", autocapitalize: "off", spellcheck: "false", class: "mono" });
  const msg = h("p", { class: "err", hidden: true });
  const btn = h("button", { class: "btn ghost", type: "submit" }, "열쇠 확인");
  return h("details", { class: "panel" },
    h("summary", null, "이 물건의 주인인가요?"),
    h("p", { class: "muted small" }, "등록할 때 받은 주인 열쇠를 넣으면 이 기기에서도 기록을 남기고 양도할 수 있어요."),
    h("form", { onsubmit: async e => {
      e.preventDefault();
      const tok = key.value.trim();
      await busy(btn, async () => {
        try {
          if (await DB.isOwner(tag.id, tok)) { setKey(tag.id, tok); toast("주인으로 확인됐어요"); renderTag(tag.id); }
          else { msg.hidden = false; msg.textContent = ERR.bad_token; }
        } catch (err) { msg.hidden = false; msg.textContent = errMsg(err); }
      });
    } }, field("주인 열쇠", key), msg, h("div", null, btn)));
}

async function legacy(code) {
  try {
    const map = await (await fetch("links.json", { cache: "no-store" })).json();
    if (map[code]) { location.replace(map[code]); return; }
  } catch {}
  renderFatal("등록되지 않은 QR코드예요.");
}

function loadScript(src) {
  return new Promise((ok, bad) => {
    const s = h("script", { src });
    s.onload = ok; s.onerror = bad;
    document.head.append(s);
  });
}

async function boot() {
  if (params.has("c")) return legacy(params.get("c"));
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
    try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"); Remote.init(); DB = Remote; }
    catch { return renderFatal("데이터베이스 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."); }
  }
  if (params.has("admin")) {
    if (typeof qrcode !== "function") return renderFatal("QR 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.");
    return renderAdmin();
  }
  const t = (params.get("t") || "").trim().toLowerCase();
  if (t) return renderTag(t);
  renderHome();
}

boot();
</script>
</body>
</html>
